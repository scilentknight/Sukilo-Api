services:
  # postgres is a popular open-source relational database management system. In this docker-compose configuration, we are setting up a PostgreSQL service with specific environment variables for user, password, and database name. We are also exposing the default PostgreSQL port (5432) and mounting a volume for persistent data storage.

  # postgres:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: local_dev_password
  #     POSTGRES_DB: sukilo
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres -d sukilo"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10

  # qdrant is a vector database that can be used for storing and searching high-dimensional vectors, often used in machine learning and AI applications. In this docker-compose configuration, we are setting up a Qdrant service alongside a PostgreSQL database.
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
