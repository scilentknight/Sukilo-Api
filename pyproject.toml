[project]
name = "sukilo-backend"
version = "0.1.0"
description = "Sukilo FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",
    "sqlalchemy==2.1.3",
    "psycopg[binary]>=3.1.0",
    "uvicorn[standard]==0.54.0",
    "qdrant-client>=1.12.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pillow>=10.4.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.3.0",
    "phonenumbers>=9.0.41",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
